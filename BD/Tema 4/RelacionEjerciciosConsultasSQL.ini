[Ejercicio 10] Proveedores (P) que envían piezas ROJAS a SEVILLA o MADRID. Filtra proveedores cuyos artículos y piezas estén en esas listas específicas.


SELECT DISTINCT P 
FROM ENVIOS 
WHERE T IN (SELECT T FROM ARTICULOS WHERE CIUDAD = 'SEVILLA' OR CIUDAD = 'MADRID')
AND C IN (SELECT C FROM COMPONENTES WHERE COLOR = 'ROJO');
  
  Con un inner join:
  
  SELECT e.p from envios e INNER JOIN articulos a ON e.t = a.t
  INNER JOIN componentes c ON e.C = c.C
  where c.Color = 'ROJO'
  and a.CIUDAD IN ('MADRID', 'SEVILLA');
  
  Sin inner join: 
  SELECT p FROM envios e, articulos a, componentes c 
  where e.C = a.T
  and c.c = e.C
  and c.Color = 'ROJO'
  and (a.CIUDAD = 'MADRID' OR a.CIUDAD = 'SEVILLA');
  


[Ejercicio 11 Piezas (C) enviadas por un proveedor de SEVILLA a un artículo de SEVILLA.]

SELECT C FROM ENVIOS 
WHERE P IN (SELECT P FROM PROVEEDORES WHERE CIUDAD = 'SEVILLA')
AND T IN (SELECT T FROM ARTICULOS WHERE CIUDAD = 'SEVILLA');

	Con subconsultas: 
	
-- Paso 1

SELECT P FROM PROVEEDORES WHERE CIUDAD = 'SEVILLA'; -- Nos devuelve P1, P3, P4

SELECT T FROM ARTICULOS WHERE CIUDAD = 'SELECT2'; -- Nos devuelve T5, T7 

-- Paso 2

SELECT C FROM ENVIOS
WHERE P IN ('P1', 'P3', 'P4')
AND T IN ('T5', 'T7');

	Con un join:
  
SELECT DISTINCT ENVIOS.C FROM ENVIOS 
JOIN PROVEEDORES ON ENVIOS.P = PROVEEDORES.P 
JOIN ARTICULOS ON ENVIOS.T = ARTICULOS.T 
WHERE PROVEEDORES.CIUDAD = 'SEVILLA' AND ARTICULOS.CIUDAD = 'SEVILLA';



[Ejercicio 12 Obtener  los  valores  de  T#  para  los  artículos  que  usan  al  menos  un  componente  que  se   puede obtener con el proveedor P1]

	Con un join: 
	
SELECT DISTINCT e1.t FROM ENVIOS e1 INNER JOIN ENVIOS e2 ON e1.c = e2.c 
WHERE e2.p = 'P1';

	Con subconsultas: 

SELECT DISTINCT T FROM ENVIOS 
WHERE C IN (SELECT C FROM ENVIOS WHERE P = 'P1');

[Ejercicio 13 Obtener todas las ternas (CIUDAD, C#, CIUDAD) tales que un proveedor de la primera CIUDAD suministre el componente especificado para un artículo montado en la segunda CIUDAD. ]

SELECT DISTINCT p.CIUDAD as 'CIUDAD proveedor', e.c , a.CIUDAD as 'CIUDAD articulo' 
FROM proveedores p INNER JOIN envios e ON e.p = p.p
INNER JOIN articulos a ON a.t = e.t


[Ejercicio 14 Repetir  el  ejercicio  anterior  pero  sin  recuperar  las  ternas  en  los  que  los  dos  valores  de  
ciudad sean los mismos. ]

SELECT DISTINCT p.CIUDAD as 'CIUDAD proveedor', e.c , a.CIUDAD as 'CIUDAD articulo' 
FROM proveedores p INNER JOIN envios e ON e.p = p.p
INNER JOIN articulos a ON a.t = e.t
where p.CIUDAD != a.CIUDAD


[Ejercicio 15  Obtener  el  número  de  suministros,  el  de  artículos  distintos  suministrados  y  la  cantidad  
total de artículos suministrados por el proveedor P2.]

SELECT COUNT(*), COUNT(DISTINCT T), SUM(CANTIDAD)
FROM ENVIOS
WHERE P = 'P2';

[Ejercicio 16  Para cada artículo y componente suministrado obtener los valores de C#, T# y la cantidad 
total correspondiente.]

SELECT C, T, SUM(CANTIDAD) FROM ENVIOS
GROUP BY C, T;


[Ejercicio 17 Obtener los valores de T# de los artículos abastecidos al menos por un proveedor que no 
viva en MADRID y que no esté en la misma ciudad en la que se monta el artículo. ]

SELECT DISTINCT e.T
FROM ENVIOS e INNER JOIN PROVEEDORES p ON e.P = p.P INNER JOIN ARTICULOS a ON e.T = a.T
WHERE p.CIUDAD != 'MADRID' AND p.CIUDAD != a.CIUDAD
ORDER BY T ASC;

Con subconsultas: 

SELECT DISTINCT e.T FROM ENVIOS e INNER JOIN articulos a ON e.T = a.T 
WHERE EXISTS (SELECT * FROM PROVEEDORES p 
              WHERE p.p = e.p 
              AND p.CIUDAD != a.CIUDAD
              AND p.CIUDAD != 'MADRID')
ORDER BY T ASC;

[Ejercicio 18 Obtener los valores de P# para los proveedores que suministran al menos un componente, 
suministrado al menos por un proveedor, que suministra al menos un componente ROJO. ]

Con subconsultas: 

SELECT DISTINCT P FROM ENVIOS e WHERE C IN (SELECT C FROM ENVIOS 
                                            WHERE P IN (SELECT P FROM ENVIOS)
                                            WHERE C IN (SELECT C FROM COMPONENTES WHERE COLOR = 'ROJO')

Con INNER JOIN:

SELECT DISTINCT e1.P
FROM ENVIOS e1
INNER JOIN ENVIOS e2 ON e1.C = e2.C        -- e2 busca quién más manda la pieza de e1
INNER JOIN ENVIOS e3 ON e2.P = e3.P        -- e3 busca qué otras piezas manda ese proveedor
INNER JOIN COMPONENTES c ON e3.C = c.C     -- Por último, comprobamos si esa pieza es roja
WHERE c.COLOR = 'ROJO';


[Ejercicio 19 Obtener  los  identificadores  de  artículos,  T#,  para  los  que  se  ha  suministrado  algún  
componente del que se haya suministrado una media superior a 320 artículos.]

Con subconsultas: 

SELECT DISTINCT T FROM ENVIOS 
WHERE C IN (SELECT C FROM ENVIOS GROUP BY C HAVING AVG(CANTIDAD) > 320)
ORDER BY T ASC;


[Ejercicio 20 Seleccionar  los  identificadores  de  proveedores  que  hayan  realizado  algún  envío  con  
Cantidad  mayor  que  la  media  de  los  envíos  realizados  para  el  componente  a  que  
corresponda dicho envío.]

Con subconsultas: 

SELECT DISTINCT P FROM ENVIOS e1
WHERE CANTIDAD > (SELECT AVG (CANTIDAD) FROM ENVIOS e2 WHERE e1.C = e2.C);


