[Ejercicio 10] Proveedores (P) que envían piezas ROJAS a SEVILLA o MADRID. Filtra proveedores cuyos artículos y piezas estén en esas listas específicas.


SELECT DISTINCT P 
FROM ENVIOS 
WHERE T IN (SELECT T FROM ARTICULOS WHERE CIUDAD = 'SEVILLA' OR CIUDAD = 'MADRID')
AND C IN (SELECT C FROM COMPONENTES WHERE COLOR = 'ROJO');
  
  Con un inner join:
  
  SELECT e.p from envios e INNER JOIN articulos a ON e.t = a.t
  INNER JOIN componentes c ON e.C = c.C
  where c.Color = 'ROJO'
  and a.CIUDAD IN ('MADRID', 'SEVILLA');
  
  Sin inner join: 
  SELECT p FROM envios e, articulos a, componentes c 
  where e.C = a.T
  and c.c = e.C
  and c.Color = 'ROJO'
  and (a.CIUDAD = 'MADRID' OR a.CIUDAD = 'SEVILLA');
  


[Ejercicio 11 Piezas (C) enviadas por un proveedor de SEVILLA a un artículo de SEVILLA.]

SELECT C FROM ENVIOS 
WHERE P IN (SELECT P FROM PROVEEDORES WHERE CIUDAD = 'SEVILLA')
AND T IN (SELECT T FROM ARTICULOS WHERE CIUDAD = 'SEVILLA');

	Con subconsultas: 
	
-- Paso 1

SELECT P FROM PROVEEDORES WHERE CIUDAD = 'SEVILLA'; -- Nos devuelve P1, P3, P4

SELECT T FROM ARTICULOS WHERE CIUDAD = 'SELECT2'; -- Nos devuelve T5, T7 

-- Paso 2

SELECT C FROM ENVIOS
WHERE P IN ('P1', 'P3', 'P4')
AND T IN ('T5', 'T7');

	Con un join:
  
SELECT DISTINCT ENVIOS.C FROM ENVIOS 
JOIN PROVEEDORES ON ENVIOS.P = PROVEEDORES.P 
JOIN ARTICULOS ON ENVIOS.T = ARTICULOS.T 
WHERE PROVEEDORES.CIUDAD = 'SEVILLA' AND ARTICULOS.CIUDAD = 'SEVILLA';



[Ejercicio 12 Obtener  los  valores  de  T#  para  los  artículos  que  usan  al  menos  un  componente  que  se   puede obtener con el proveedor P1]

	Con un join: 
	
SELECT DISTINCT e1.t FROM ENVIOS e1 INNER JOIN ENVIOS e2 ON e1.c = e2.c 
WHERE e2.p = 'P1';

	Con subconsultas: 

SELECT DISTINCT T FROM ENVIOS 
WHERE C IN (SELECT C FROM ENVIOS WHERE P = 'P1');

[Ejercicio 13 Obtener todas las ternas (CIUDAD, C#, CIUDAD) tales que un proveedor de la primera ciudad suministre el componente especificado para un artículo montado en la segunda ciudad. ]

SELECT PROVEEDORES.CIUDAD, ENVIOS.C, ARTICULOS.CIUDAD FROM ENVIOS
JOIN PROVEEDORES ON ENVIOS.P = PROVEEDORES.P
JOIN ARTICULOS a ON ENVIOS.T = ARTICULOS.T;

