Bloque 2: Entornos de Desarrollo - Fase de Pruebas

2.1. Metodologías de Prueba
En el desarrollo de software, la calidad se garantiza mediante dos enfoques fundamentales:

Pruebas de Caja Blanca (Estructurales): El tester tiene acceso al código fuente. Se centra en la lógica interna, flujos de control, bucles y condiciones. Se busca que cada línea de código sea ejecutada al menos una vez.

Pruebas de Caja Negra (Funcionales): El tester no conoce el código interno. Se basa en las especificaciones del sistema. Se introduce una entrada (input) y se verifica que la salida (output) sea la correcta según los requisitos.

Pruebas regresivas: Al hacer un cambio, comprobar que no se ha estropeado nada que ya funcionara con anterioridad.

2.2. Diseño de Casos de Prueba
Un caso de prueba es un conjunto de condiciones o variables bajo las cuales un evaluador determinará si una aplicación funciona correctamente. Sus pilares son:

Objetivo: ¿Qué funcionalidad específica estamos validando?

Procedimiento: ¿Qué pasos exactos se deben seguir? (¿Cómo se prueba?).

Datos de entrada: Valores que se introducen al sistema.

Resultado esperado: El comportamiento que el sistema debería tener si no hay errores.

Resultado obtenido: Lo que sucede realmente (si difiere del esperado, se reporta un "bug").


