<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoModa - Transformación Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f0fdf4; /* Light green tint */
        }
        .slide-enter {
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-slate-800 h-screen overflow-hidden selection:bg-emerald-200">

    <!-- Main Container -->
    <div id="app" class="relative w-full h-full flex flex-col items-center justify-center p-4 md:p-8">
        
        <!-- Background Elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
            <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-emerald-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
            <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-teal-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
        </div>

        <!-- Slide Content Area -->
        <div id="slide-container" class="w-full max-w-6xl aspect-video bg-white shadow-2xl rounded-3xl overflow-hidden relative flex flex-col">
            <!-- Header/Branding -->
            <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-20">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-600 text-white p-2 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.74 5.88-5.74 5.88-5.74-5.88z"/><path d="M5 13.5l7 7 7-7"/></svg>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-700">ECO<span class="text-emerald-600">MODA</span></span>
                </div>
                <div class="text-sm font-semibold text-slate-400">Consultoría DAW</div>
            </div>

            <!-- Dynamic Content -->
            <div id="content" class="flex-1 flex flex-col justify-center items-center p-8 md:p-16 relative z-10">
                <!-- Javascript will inject content here -->
            </div>

            <!-- Footer / Controls -->
            <div class="bg-slate-50 border-t border-slate-100 p-4 flex justify-between items-center">
                <div class="flex gap-2">
                    <span id="slide-indicator" class="text-sm font-mono text-slate-500">01 / 05</span>
                </div>
                <div class="flex gap-4">
                    <button onclick="prevSlide()" class="p-2 rounded-full hover:bg-slate-200 transition-colors text-slate-600 disabled:opacity-50" id="btn-prev">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button onclick="nextSlide()" class="p-2 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg transition-all transform hover:scale-105 disabled:opacity-50 disabled:bg-slate-400" id="btn-next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const slides = [
            // Slide 1: Portada
            `
            <div class="slide-enter text-center max-w-4xl">
                <div class="inline-block px-4 py-1 rounded-full bg-emerald-100 text-emerald-700 text-sm font-bold tracking-wide mb-6">
                    CASO DE ESTUDIO: TRANSFORMACIÓN DIGITAL
                </div>
                <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 mb-6 leading-tight">
                    El Futuro de <br/>
                    <span class="gradient-text">EcoModa en la Nube</span>
                </h1>
                <p class="text-xl text-slate-500 max-w-2xl mx-auto mb-10">
                    Estrategia de modernización para una red de 50 tiendas sostenibles.
                    De lo local a lo global, de lo físico a lo digital.
                </p>
                <div class="flex justify-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm border border-slate-200">
                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        <span class="text-sm font-medium text-slate-600">Optimización</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm border border-slate-200">
                        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        <span class="text-sm font-medium text-slate-600">Escalabilidad</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm border border-slate-200">
                        <div class="w-2 h-2 rounded-full bg-purple-500"></div>
                        <span class="text-sm font-medium text-slate-600">Colaboración</span>
                    </div>
                </div>
            </div>
            `,
            
            // Slide 2: Situación Actual vs Objetivo
            `
            <div class="slide-enter w-full h-full flex flex-col">
                <h2 class="text-3xl font-bold text-slate-800 mb-8">El Desafío de la Expansión</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 h-full">
                    <!-- Antes -->
                    <div class="bg-red-50 rounded-2xl p-8 border border-red-100 relative overflow-hidden group">
                        <div class="absolute top-4 right-4 bg-red-200 text-red-800 text-xs font-bold px-2 py-1 rounded">ACTUALMENTE</div>
                        <h3 class="text-xl font-bold text-red-800 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            Infraestructura Local
                        </h3>
                        <ul class="space-y-3 text-red-700/80">
                            <li class="flex items-start gap-2">• <span>50 tiendas desconectadas (Silos de información).</span></li>
                            <li class="flex items-start gap-2">• <span>Stock desactualizado hasta el cierre del día.</span></li>
                            <li class="flex items-start gap-2">• <span>Costes elevados de mantenimiento de servidores físicos.</span></li>
                            <li class="flex items-start gap-2">• <span>Dependencia de procesos manuales y papel.</span></li>
                        </ul>
                    </div>

                    <!-- Después -->
                    <div class="bg-emerald-50 rounded-2xl p-8 border border-emerald-100 relative overflow-hidden">
                        <div class="absolute top-4 right-4 bg-emerald-200 text-emerald-800 text-xs font-bold px-2 py-1 rounded">OBJETIVO CLOUD</div>
                        <h3 class="text-xl font-bold text-emerald-800 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                            Ecosistema Conectado
                        </h3>
                        <ul class="space-y-3 text-emerald-700/80">
                            <li class="flex items-start gap-2">• <span>Dato único y centralizado en tiempo real.</span></li>
                            <li class="flex items-start gap-2">• <span>Omnicanalidad (Tienda Física + Online unificadas).</span></li>
                            <li class="flex items-start gap-2">• <span>Modelo OPEX (Pago por uso).</span></li>
                            <li class="flex items-start gap-2">• <span>Escalabilidad automática en picos de venta.</span></li>
                        </ul>
                    </div>
                </div>
            </div>
            `,

            // Slide 3: Análisis de Procesos (Cards)
            `
            <div class="slide-enter w-full">
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Análisis de Áreas Clave</h2>
                <p class="text-slate-500 mb-8">Soluciones propuestas basadas en servicios SaaS e IaaS.</p>
                
                <div class="grid grid-cols-3 gap-6">
                    <!-- Card 1 -->
                    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-100 hover:shadow-xl transition-shadow">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 mb-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        </div>
                        <h3 class="font-bold text-lg mb-2">Logística y Stock</h3>
                        <p class="text-sm text-slate-500 mb-4">Centralización del inventario de 50 tiendas.</p>
                        <div class="bg-slate-50 p-3 rounded text-sm">
                            <strong class="text-emerald-600 block mb-1">Ventaja:</strong> Dato único, sin discrepancias.
                            <div class="h-2"></div>
                            <strong class="text-orange-600 block mb-1">Reto:</strong> Dependencia de la conexión a Internet.
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-100 hover:shadow-xl transition-shadow">
                        <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600 mb-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        </div>
                        <h3 class="font-bold text-lg mb-2">Ventas (CRM)</h3>
                        <p class="text-sm text-slate-500 mb-4">Unificación de clientes Web y Tienda Física.</p>
                        <div class="bg-slate-50 p-3 rounded text-sm">
                            <strong class="text-emerald-600 block mb-1">Ventaja:</strong> Elasticidad en Black Friday.
                            <div class="h-2"></div>
                            <strong class="text-orange-600 block mb-1">Reto:</strong> Cumplimiento GDPR estricto.
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-100 hover:shadow-xl transition-shadow">
                        <div class="w-12 h-12 bg-pink-100 rounded-lg flex items-center justify-center text-pink-600 mb-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                        <h3 class="font-bold text-lg mb-2">Recursos Humanos</h3>
                        <p class="text-sm text-slate-500 mb-4">Suite Colaborativa y Portal del Empleado.</p>
                        <div class="bg-slate-50 p-3 rounded text-sm">
                            <strong class="text-emerald-600 block mb-1">Ventaja:</strong> Movilidad y ahorro en licencias.
                            <div class="h-2"></div>
                            <strong class="text-orange-600 block mb-1">Reto:</strong> Resistencia al cambio del staff.
                        </div>
                    </div>
                </div>
            </div>
            `,

            // Slide 4: Gráfica Visual (Simulada con CSS)
            `
            <div class="slide-enter w-full flex flex-col items-center">
                <h2 class="text-3xl font-bold text-slate-800 mb-10">Impacto en la Gestión</h2>
                
                <div class="w-full max-w-4xl flex gap-12 items-end justify-center h-64 mb-6">
                    <!-- Bar 1 -->
                    <div class="flex flex-col items-center gap-2 group w-1/4">
                        <div class="text-slate-500 font-semibold mb-2 opacity-0 group-hover:opacity-100 transition-opacity">-40%</div>
                        <div class="w-full bg-slate-200 rounded-t-xl relative overflow-hidden h-32 group-hover:bg-slate-300 transition-all">
                             <div class="absolute bottom-0 w-full bg-emerald-500 h-[10%] group-hover:h-[60%] transition-all duration-1000"></div>
                        </div>
                        <span class="font-bold text-slate-700">Costes Fijos</span>
                    </div>

                    <!-- Bar 2 -->
                    <div class="flex flex-col items-center gap-2 group w-1/4">
                        <div class="text-slate-500 font-semibold mb-2 opacity-0 group-hover:opacity-100 transition-opacity">+90%</div>
                        <div class="w-full bg-slate-200 rounded-t-xl relative overflow-hidden h-48 group-hover:bg-slate-300 transition-all">
                             <div class="absolute bottom-0 w-full bg-emerald-500 h-[20%] group-hover:h-[90%] transition-all duration-1000 delay-100"></div>
                        </div>
                        <span class="font-bold text-slate-700">Disponibilidad</span>
                    </div>

                    <!-- Bar 3 -->
                    <div class="flex flex-col items-center gap-2 group w-1/4">
                        <div class="text-slate-500 font-semibold mb-2 opacity-0 group-hover:opacity-100 transition-opacity">+100%</div>
                        <div class="w-full bg-slate-200 rounded-t-xl relative overflow-hidden h-64 group-hover:bg-slate-300 transition-all">
                             <div class="absolute bottom-0 w-full bg-emerald-500 h-[10%] group-hover:h-[100%] transition-all duration-1000 delay-200"></div>
                        </div>
                        <span class="font-bold text-slate-700">Colaboración</span>
                    </div>
                </div>
                <p class="text-center text-slate-500 mt-4">Proyección de mejora tras 12 meses de implementación Cloud.</p>
            </div>
            `,

             // Slide 5: Conclusiones
             `
            <div class="slide-enter w-full max-w-4xl text-center">
                <h2 class="text-4xl font-bold text-slate-800 mb-8">Conclusiones Finales</h2>
                
                <div class="bg-emerald-900 text-white p-8 rounded-2xl shadow-xl flex flex-col md:flex-row items-center gap-8 text-left">
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold text-emerald-300 mb-4">¿Por qué ahora?</h3>
                        <p class="text-emerald-100 leading-relaxed mb-4">
                            EcoModa ya no es una tienda local. La nube no es una opción, es la única infraestructura capaz de soportar 50 sedes sincronizadas sin una inversión millonaria en hardware propio.
                        </p>
                        <p class="text-emerald-100 leading-relaxed">
                            Migrar ahora significa convertir la tecnología en una ventaja competitiva, no en un cuello de botella.
                        </p>
                    </div>
                    <div class="w-full md:w-1/3 flex flex-col gap-4">
                        <div class="bg-white/10 p-4 rounded-lg backdrop-blur-sm">
                            <span class="block text-2xl font-bold">IaaS / PaaS</span>
                            <span class="text-sm opacity-70">Modelo Flexible</span>
                        </div>
                        <div class="bg-white/10 p-4 rounded-lg backdrop-blur-sm">
                            <span class="block text-2xl font-bold">Seguridad</span>
                            <span class="text-sm opacity-70">Backups Automáticos</span>
                        </div>
                    </div>
                </div>
                
                <div class="mt-12 text-slate-400 font-mono text-sm">
                    Desarrollado por Grupo Expertos DAW • 2024
                </div>
            </div>
            `
        ];

        let currentSlide = 0;
        const contentDiv = document.getElementById('content');
        const indicator = document.getElementById('slide-indicator');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function renderSlide() {
            contentDiv.innerHTML = slides[currentSlide];
            indicator.innerText = `0${currentSlide + 1} / 0${slides.length}`;
            
            // Button States
            btnPrev.disabled = currentSlide === 0;
            btnNext.disabled = currentSlide === slides.length - 1;
            
            if (currentSlide === slides.length - 1) {
                btnNext.classList.add('bg-slate-400');
                btnNext.classList.remove('bg-emerald-600');
            } else {
                btnNext.classList.remove('bg-slate-400');
                btnNext.classList.add('bg-emerald-600');
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        // Initialize
        renderSlide();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

    </script>
</body>
</html>
