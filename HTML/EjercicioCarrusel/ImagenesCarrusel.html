<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de imagenes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="carrusel-wrapper">
        <div class="carrusel-contenedor">
            <div id="inicio" class="carrusel-item">
                <img src="imagenes/Schnoz dentista.jpeg" alt="Imagen 1">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/schnoz cat.png" alt="Imagen 2">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/schnoz calle.png" alt="Imagen 3">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/grasses schnoz.jpg" alt="Imagen 4">
            </div>
            
            <div class="carrusel-item">
                <img src="imagenes/cumple schnoz.jpg" alt="Imagen 5">
            </div>
            
            <div class="carrusel-item">
                <img src="imagenes/schnozcola.jpg" alt="Imagen 6">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/Schnoz.jpg" alt="Imagen 7">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/schnoz peluche.jpg" alt="Imagen 8">
            </div>

            <div class="carrusel-item">
                <img src="imagenes/schnoz jew.png" alt="Imagen 9">
            </div>

            <div id="final" class="carrusel-item">
                <img src="imagenes/schnoz in office.png" alt="Imagen 10">
            </div>
        </div>

        <div class="carrusel-controles">
            <a href="#inicio" class="boton">Inicio</a>
            <a href="#final" class="boton">Final</a>
        </div>
    </main>

</body>
</html>
